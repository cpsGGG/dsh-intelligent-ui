name: Bug report / 问题反馈
description: Report a rendering, installation, state, or compatibility problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '感谢反馈。请先移除截图或回答里的私人内容、密钥和本机路径。Please remove private data before posting.'
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: Plugin version, DSH version, OS, and model name.
      placeholder: 'IUI 0.6.1 / DSH 0.2.1-rc.3 / Windows 11 / model'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 如何复现
      description: Include a minimal question or sanitized component source if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期和实际效果
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Other plugins / 其他插件
      description: Especially theme, Markdown, image, or conversation rendering plugins.
